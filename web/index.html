<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>kimimachi</title>
    <style>
    :root {
      --bg: #16161d;
      --card: #23232e;
      --text: #f4f1e8;
      --muted: #b8b4a8;
      --accent: #f2c14e;
      --err: #ff7a6b;
    }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui,sans-serif;
    }
    main {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 16px;
    }
    form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
      padding: 12px;
      background: var(--card);
      border: 2px solid #000;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    input {
      font: inherit;
      font-size: 15px;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #555;
      background: #15151c;
      color: var(--text);
      width: 110px;
    }
    input[name=title] {
      width: 180px;
    }
    button {
      font: inherit;
      font-size: 15px;
      padding: 9px 16px;
      border-radius: 6px;
      border: 0;
      background: var(--accent);
      color: #1b1b1b;
      cursor: pointer;
    }
    button:disabled {
      opacity: .5;
      cursor: default;
    }
    button.sub {
      background: none;
      color: var(--muted);
      padding: 2px 6px;
      font-size: 12px;
      border: 1px solid #555;
    }
    details {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
    }
    details > div {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    #status {
      white-space: pre-wrap;
      font: 12px/1.5 ui-monospace,monospace;
      color: var(--muted);
      background: #0f0f14;
      border-radius: 6px;
      padding: 8px 10px;
      margin: 0 0 16px;
      display: none;
      max-height: 180px;
      overflow: auto;
    }
    #status.err {
      color: var(--err);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(220px,1fr));
      gap: 16px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 10px;
      background: var(--card);
      border: 2px solid #000;
      border-radius: 8px;
    }
    .card a.open {
      color: inherit;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .card:hover {
      outline: 2px solid var(--accent);
    }
    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      image-rendering: pixelated;
      border-radius: 4px;
    }
    .card .tools {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
      font-size: 12px;
    }
    .card .tools a {
      color: var(--muted);
    }
    small,
    .note {
      color: var(--muted);
    }
    .note {
      font-size: 12px;
      margin: 16px 0 0;
    }
    </style>
  </head>
  <body>
    <main>
      <h1>kimimachi — 現在地からピクセルマップ</h1>
      <form id="gen">
        <label>範囲 (m)<input name="size" type="number" value="1500" min="300" max="3000" step="100"></label>
        <label>マップ名 (任意)<input name="title" placeholder="住所から自動"></label>
        <button id="here" type="button">📍 現在地からマップを作る</button>
        <details>
          <summary>座標を直接入力</summary>
          <div>
            <label>緯度<input name="lat" type="number" step="any" placeholder="37.4463"></label>
            <label>経度<input name="lon" type="number" step="any" placeholder="138.8514"></label>
            <button>この座標で作る</button>
          </div>
        </details>
      </form>
      <pre id="status"></pre>
      <div class="grid" id="grid"></div>
      <p
        class="note">マップはこのブラウザの中で作られ、このブラウザにだけ保存されます（地図データは国土地理院・Project PLATEAU から直接取得します）。日本国内のみ。</p>
    </main>
    <script type="module" src="index.js"></script>
  </body>
</html>
